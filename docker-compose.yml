version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pr-app-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pr_summary_db}
      POSTGRES_USER: ${POSTGRES_USER:-pr_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./.postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pr_app} -d ${POSTGRES_DB:-pr_summary_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network
    labels:
      - "com.example.description=PostgreSQL Database"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pr-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-pr_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pr_summary_db}
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DOMAIN: ${DOMAIN}
      MAX_DIFF_SIZE: ${MAX_DIFF_SIZE:-50000}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-60000}
      DEBUG: ${DEBUG:-false}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - app-network
    labels:
      - "com.example.description=PR Summary AI App"

  nginx:
    image: nginx:latest-alpine
    container_name: pr-app-nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./.nginx_cache:/var/cache/nginx
    restart: unless-stopped
    networks:
      - app-network
    labels:
      - "com.example.description=Reverse proxy and HTTPS termination"

volumes: {}

networks:
  app-network:
    driver: bridge
